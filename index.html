<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badhon Game Profile</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#16181d;--mut:#6b7280;--ac:#4f46e5;--bd:#e3e5ea;--ok:#15803d;--er:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--tx:#e8eaef;--mut:#9aa1ae;--ac:#818cf8;--bd:#2a2e38;--ok:#4ade80;--er:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:12px 12px 90px}
h1{font-size:18px;margin:6px 4px 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
select,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
button{padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;font-weight:600}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>button{flex:1;min-width:120px}
.app{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--bd)}
.app:last-child{border-bottom:0}
.app img{width:38px;height:38px;border-radius:9px;background:var(--bd);flex:none}
.app .t{flex:1;min-width:0}
.app .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .k{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app select{margin-top:6px;padding:6px;font-size:13px}
input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ac)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;max-height:260px;overflow:auto;margin:10px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:8px}
.bar button{flex:1;padding:14px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.ok{color:var(--ok)}.er{color:var(--er)}
.cur div{padding:3px 0;font-size:14px}.cur b{color:var(--ac)}.cur .m{color:var(--mut);font-size:12px}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.sw input{width:20px;height:20px}
</style>
</head>
<body>
<h1>Badhon Game Profile</h1>

<div id="nokernel" class="card" style="display:none">
  <b>KernelSU WebUI API not found.</b><br>
  Open this page with KernelSU / APatch manager, or from <b>KSUWebUI Standalone</b> / <b>MMRL</b> (for Magisk).
</div>

<div class="card" id="status">
  <h2>Current (active)</h2>
  <div id="cur" class="cur">Loading...</div>
</div>

<div class="card">
  <h2>Device</h2>
  <label>Select device</label>
  <select id="profile"></select>
  <div class="row">
    <button id="rand">🎲 Random all (new seed)</button>
  </div>
</div>

<div class="card">
  <h2>Target apps <span id="cnt"></span></h2>
  <input type="text" id="q" placeholder="Search app or package">
  <div class="sw"><input type="checkbox" id="sys"><label for="sys" style="margin:0;color:inherit">Show system apps</label></div>
  <div class="sw"><input type="checkbox" id="onlysel"><label for="onlysel" style="margin:0;color:inherit">Show selected only</label></div>
  <div id="apps" style="margin-top:8px"></div>
</div>

<div class="card">
  <h2>Tools</h2>
  <div class="row">
    <button id="diag">🔍 Diagnose</button>
    <button id="log">📜 Show log</button>
  </div>
  <pre id="out" style="display:none"></pre>
</div>

<div class="msg" id="msg"></div>
<div class="bar">
  <button class="p" id="apply">⚡ Action (Save &amp; Apply)</button>
</div>

<script>
const MOD = '/data/adb/modules/badhon_game_profile';
const $ = s => document.querySelector(s);
const hasKsu = typeof ksu !== 'undefined' && typeof ksu.exec === 'function';

const state = {
  profiles: [],            // profile names
  cfg: {mode: 'manual', profile: '', seed: '1', log: '1'},
  sel: new Map(),          // pkg -> per-app profile ('' = default)
  pkgs: [],                // [{pkg,label}]
  labels: {},
  saved: {mode: 'manual', profile: '', seed: '1', sel: new Map()}
};

function exec(cmd) {
  return new Promise(res => {
    if (!hasKsu) return res({code: -1, out: '', err: 'no ksu api'});
    const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    window[cb] = (code, out, err) => { delete window[cb]; res({code, out: out || '', err: err || ''}); };
    try { ksu.exec(cmd, '{}', cb); } catch (e) { delete window[cb]; res({code: -1, out: '', err: String(e)}); }
  });
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function say(t, ok) { const m = $('#msg'); m.textContent = t; m.className = 'msg ' + (ok === true ? 'ok' : ok === false ? 'er' : ''); }
function show(t) { const o = $('#out'); o.style.display = 'block'; o.textContent = t || '(empty)'; }

async function writeFile(path, text) {
  const b64 = btoa(unescape(encodeURIComponent(text)));
  return exec("echo '" + b64 + "' | base64 -d > '" + path + "'");
}
function parseKV(t) {
  const m = {};
  t.split('\n').forEach(l => { l = l.trim(); if (!l || l[0] === '#') return; const i = l.indexOf('='); if (i > 0) m[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  return m;
}

const RANDOM = '__random__';
function fnv1a(str) {
  let h = 1469598103934665603n; const M = (1n << 64n) - 1n;
  for (const b of new TextEncoder().encode(str)) { h ^= BigInt(b); h = (h * 1099511628211n) & M; }
  return h;
}
// same selection logic as module.cpp
function effectiveProfile(pkg) {
  const per = state.saved.sel.get(pkg) || '';
  if (per && state.profiles.includes(per)) return per;
  if (state.saved.mode !== 'random') return state.profiles.includes(state.saved.profile) ? state.saved.profile : (state.profiles[0] || '?');
  if (!state.profiles.length) return '?';
  return state.profiles[Number(fnv1a(state.saved.seed + ':' + pkg) % BigInt(state.profiles.length))];
}
function renderStatus() {
  const sv = state.saved;
  let h = '<div>Mode: <b>' + (sv.mode === 'random' ? 'Random' : 'Manual') + '</b>' +
          (sv.mode === 'random' ? ' &nbsp;·&nbsp; Seed: <b>' + esc(sv.seed) + '</b>' : ' &nbsp;·&nbsp; Device: <b>' + esc(sv.profile) + '</b>') + '</div>';
  if (!sv.sel.size) h += '<div class="m">No target app selected yet.</div>';
  sv.sel.forEach((_, pkg) => {
    h += '<div>' + esc(state.labels[pkg] || pkg) + ' → <b>' + esc(effectiveProfile(pkg)) + '</b><div class="m">' + esc(pkg) + '</div></div>';
  });
  $('#cur').innerHTML = h;
}
function snapshotSaved() {
  state.saved = {mode: state.cfg.mode === 'random' ? 'random' : 'manual', profile: state.cfg.profile, seed: String(state.cfg.seed),
                 sel: new Map(state.sel)};
}

async function loadConfig() {
  const c = await exec("cat '" + MOD + "/config.txt'");
  Object.assign(state.cfg, parseKV(c.out));
  const p = await exec("cat '" + MOD + "/profiles.conf'");
  state.profiles = p.out.split('\n').map(l => l.trim()).filter(l => /^\[.+\]$/.test(l)).map(l => l.slice(1, -1));
  const a = await exec("cat '" + MOD + "/apps.txt'");
  state.sel.clear();
  a.out.split('\n').forEach(l => {
    l = l.trim(); if (!l || l[0] === '#') return;
    const i = l.indexOf('=');
    if (i < 0) state.sel.set(l, ''); else state.sel.set(l.slice(0, i).trim(), l.slice(i + 1).trim());
  });
  const ps = $('#profile');
  ps.innerHTML = '<option value="' + RANDOM + '">🎲 Random (per app, from seed)</option>' +
                 state.profiles.map(n => '<option>' + esc(n) + '</option>').join('');
  if (state.cfg.mode === 'random') ps.value = RANDOM;
  else if (state.profiles.includes(state.cfg.profile)) ps.value = state.cfg.profile;
  snapshotSaved();
}

async function loadPackages() {
  const sys = $('#sys').checked;
  let list = [];
  if (hasKsu && typeof ksu.listPackages === 'function') {
    try { const r = ksu.listPackages(sys ? 'system' : 'user'); list = typeof r === 'string' ? JSON.parse(r) : r; } catch (e) { list = []; }
  }
  if (!list || !list.length) {
    const r = await exec('pm list packages ' + (sys ? '-s' : '-3') + ' | cut -d: -f2');
    list = r.out.split('\n').map(s => s.trim()).filter(Boolean);
  }
  state.sel.forEach((_, k) => { if (!list.includes(k)) list.push(k); });   // keep already-selected apps visible
  if (hasKsu && typeof ksu.getPackagesInfo === 'function') {
    try {
      const r = ksu.getPackagesInfo(JSON.stringify(list));
      const arr = typeof r === 'string' ? JSON.parse(r) : r;
      arr.forEach(x => { if (x && x.packageName) state.labels[x.packageName] = x.appLabel || x.packageName; });
    } catch (e) {}
  }
  state.pkgs = list.map(pkg => ({pkg, label: state.labels[pkg] || pkg}))
                   .sort((a, b) => a.label.toLowerCase().localeCompare(b.label.toLowerCase()));
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  const only = $('#onlysel').checked;
  const opts = ['<option value="">Default profile</option>'].concat(state.profiles.map(n => '<option>' + esc(n) + '</option>')).join('');
  const rows = state.pkgs.filter(a =>
    (!only || state.sel.has(a.pkg)) &&
    (!q || a.label.toLowerCase().includes(q) || a.pkg.toLowerCase().includes(q)));
  $('#apps').innerHTML = rows.map(a => {
    const on = state.sel.has(a.pkg);
    return '<div class="app" data-p="' + esc(a.pkg) + '">' +
      '<input type="checkbox" ' + (on ? 'checked' : '') + '>' +
      '<img src="ksu://icon/' + esc(a.pkg) + '" onerror="this.style.visibility=\'hidden\'">' +
      '<div class="t"><div class="n">' + esc(a.label) + '</div><div class="k">' + esc(a.pkg) + '</div>' +
      (on ? '<select class="pp">' + opts + '</select>' : '') + '</div></div>';
  }).join('') || '<div style="color:var(--mut);padding:8px">No apps</div>';
  document.querySelectorAll('.app').forEach(el => {
    const pkg = el.dataset.p;
    el.querySelector('input').onchange = e => {
      if (e.target.checked) state.sel.set(pkg, state.sel.get(pkg) || ''); else state.sel.delete(pkg);
      render();
    };
    const s = el.querySelector('.pp');
    if (s) { s.value = state.sel.get(pkg) || ''; s.onchange = () => state.sel.set(pkg, s.value); }
  });
  $('#cnt').textContent = '(' + state.sel.size + ' selected)';
}

async function save() {
  const pv = $('#profile').value;
  if (pv === RANDOM) state.cfg.mode = 'random';
  else { state.cfg.mode = 'manual'; state.cfg.profile = pv || state.cfg.profile; }
  const cfg = '# written by WebUI\nmode=' + state.cfg.mode + '\nprofile=' + state.cfg.profile +
              '\nseed=' + state.cfg.seed + '\nlog=' + (state.cfg.log || '1') + '\n';
  let apps = '# written by WebUI. package or package=Profile\n';
  state.sel.forEach((pr, pkg) => { apps += pkg + (pr ? '=' + pr : '') + '\n'; });
  const r1 = await writeFile(MOD + '/config.txt', cfg);
  const r2 = await writeFile(MOD + '/apps.txt', apps);
  if (r1.code !== 0 || r2.code !== 0) { say('Save failed: ' + (r1.err || r2.err), false); return false; }
  return true;
}
async function stopApps() {
  let n = 0;
  for (const pkg of state.sel.keys()) { const r = await exec('am force-stop ' + pkg); if (r.code === 0) n++; }
  return n;
}
async function apply() {
  say('Saving...');
  if (!(await save())) return;
  const n = await stopApps();
  snapshotSaved(); renderStatus();
  say('Applied. ' + state.sel.size + ' app(s) saved, ' + n + ' restarted. Open the game again.', true);
}
async function randomAll() {
  const a = new Uint32Array(1); crypto.getRandomValues(a);
  state.cfg.seed = String(a[0]);
  $('#profile').value = RANDOM;
  say('Random seed ' + state.cfg.seed + '...');
  if (!(await save())) return;
  const n = await stopApps();
  snapshotSaved(); renderStatus();
  say('Random profile set (seed ' + state.cfg.seed + '). ' + n + ' app(s) restarted.', true);
}
async function diagnose() {
  show('Running...');
  const r = await exec(
    'echo "ABI: $(getprop ro.product.cpu.abi)"; echo "Android: $(getprop ro.build.version.release)"; ' +
    'echo "--- module zygisk dir"; ls -l ' + MOD + '/zygisk 2>&1; ' +
    '[ -f ' + MOD + '/disable ] && echo "!! MODULE DISABLED"; [ -f ' + MOD + '/remove ] && echo "!! MODULE MARKED FOR REMOVE"; ' +
    'echo "--- config"; grep -v "^#" ' + MOD + '/config.txt; ' +
    'echo "--- apps"; grep -v "^#" ' + MOD + '/apps.txt; ' +
    'echo "--- zygisk processes"; ps -A 2>/dev/null | grep -i zygisk | head -5; ' +
    'echo "--- module log (last 15)"; logcat -d -s BadhonGP 2>&1 | tail -15');
  show(r.out + r.err);
}
async function showLog() {
  show('Reading...');
  const r = await exec('logcat -d -s BadhonGP 2>&1 | tail -40');
  show(r.out + r.err || 'No BadhonGP log yet. Open a target game first.');
}

async function init() {
  if (!hasKsu) { $('#nokernel').style.display = 'block'; return; }
  await loadConfig();
  await loadPackages();
  render();
  renderStatus();
  $('#q').oninput = render;
  $('#onlysel').onchange = render;
  $('#sys').onchange = async () => { await loadPackages(); render(); };
  $('#apply').onclick = apply;
  $('#rand').onclick = randomAll;
  $('#diag').onclick = diagnose;
  $('#log').onclick = showLog;
}
init();
</script>
</body>
</html>
