name: build-module
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show repo files
        run: |
          find . -type f -not -path './.git/*' | sort
          for f in src/module.cpp CMakeLists.txt build.sh module/module.prop; do
            [ -f "$f" ] || { echo "::error::MISSING FILE in repo: $f (upload the full bgp folder contents)"; exit 1; }
          done
      - name: Get zygisk.hpp
        run: |
          mkdir -p src
          curl -fsSL -o src/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          wc -l src/zygisk.hpp
      - name: Build
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $ANDROID_NDK"
          chmod +x build.sh
          ./build.sh
      - name: Check zip
        run: unzip -l badhon_game_profile.zip
      - uses: actions/upload-artifact@v4
        with:
          name: badhon_game_profile
          path: badhon_game_profile.zip
